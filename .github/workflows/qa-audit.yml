name: Enterprise QA Audit Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qa-audit:
    name: Headless Chrome Deep Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Mirror & Build Public Distribution
        run: node scripts/build.js

      - name: Execute Headless Quality Gate
        run: node scripts/ci-audit.js
