name: Enterprise QA Audit Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qa-audit:
    name: Headless Chrome Deep Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Chrome Availability
        run: |
          which google-chrome || which chromium-browser || echo "Chrome binary in path"

      - name: Install Dependencies
        run: npm ci

      - name: Mirror & Build Public Distribution
        run: node scripts/build.js

      - name: Execute Headless Quality Gate
        env:
          DISPLAY: ''
        run: node scripts/ci-audit.js

      - name: Verify Security & Rate Limiting Hardening
        env:
          PORT: '3000'
          APP_URL: 'http://localhost:3000'
        run: node scripts/verify-security-hardening.js

      - name: Verify System-Wide Health & Architecture
        run: node scripts/system-wide-health-audit.js

      - name: Verify Cloud Serverless & Production Blueprints
        run: node scripts/verify-cloud-deployment-health.js

      - name: Verify End-of-Month Payroll & FBR Tax Staging
        run: node scripts/staging-payroll-fbr-run.js
