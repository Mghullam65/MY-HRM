<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>FlowHCM Pro — Human Capital Management & Payroll Solutions</title>
  <meta name="description" content="FlowHCM Pro — Enterprise HRMS & Payroll Management Software. Empowering organizations with smart attendance, payroll processing, performance reviews, and AI-driven HR management.">
  <meta name="theme-color" content="#0170b9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Favicon (FlowHCM branded SVG) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='10' fill='%230170b9'/><path d='M9 13C9 10.79 10.79 9 13 9H23C25.21 9 27 10.79 27 13V15H15V19H25V23H15V27H9V13Z' fill='white'/><circle cx='23' cy='25' r='2' fill='%2300d2ff'/></svg>">

  <!-- Fonts: Poppins (FlowHCM Headings) + Inter / Roboto (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="css/main.css">

  <style>
    /* ── Additional inline overrides ── */
    .page-content { animation: fadeIn 0.25s ease; }
    .nav-item { animation: none; }

    /* Print styles */
    @media print {
      .sidebar, .topbar, #toast-container, .btn, .tbl-actions, .filter-bar,
      .topbar-actions, .topbar-search, .sidebar-toggle, .modal-close, .modal-footer { display: none !important; }
      .main-content { margin: 0 !important; padding: 0 !important; width: 100% !important; }
      body { background: white !important; color: #111 !important; }
      .card { border: 1px solid #ddd; box-shadow: none !important; }
      th, td { color: #111 !important; }
      .stat-card, .chart-card { border: 1px solid #ddd; }
      .modal-overlay.open {
        position: static !important;
        background: transparent !important;
        padding: 0 !important;
        display: block !important;
      }
      .modal-overlay.open .modal {
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .modal-overlay.open .modal-header {
        border-bottom: 2px solid #2563eb !important;
        padding: 10px 0 !important;
      }
      .modal-overlay.open .modal-body {
        padding: 10px 0 !important;
      }
      @page {
        size: A4 portrait;
        margin: 12mm;
      }
    }
  </style>
</head>

<body>

<!-- ══════════════════════════════════════
     LOGIN PAGE
══════════════════════════════════════ -->
<div id="login-page" style="display:none"></div>

<!-- ══════════════════════════════════════
     MAIN APP SHELL
══════════════════════════════════════ -->
<div id="app" style="display:none">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar"></aside>

  <!-- Main Area -->
  <div class="main-content">
    <!-- Top Bar -->
    <header id="topbar" class="topbar"></header>

    <!-- Page Content -->
    <main id="page-content" class="page-content"></main>
  </div>
</div>

<!-- ══════════════════════════════════════
     TOAST CONTAINER
══════════════════════════════════════ -->
<div id="toast-container"></div>

<!-- ══════════════════════════════════════
     BROWSER-STYLE ACTIVITY HISTORY DRAWER
══════════════════════════════════════ -->
<div id="history-drawer-overlay" class="history-drawer-overlay" onclick="App.closeHistoryDrawer()"></div>
<aside id="history-drawer" class="history-drawer"></aside>

<!-- ══════════════════════════════════════
     FLOWHCM AI ASSISTANT FLOATING TRIGGER
══════════════════════════════════════ -->
<button id="flow-ai-floating-btn" class="flow-ai-floating-btn" onclick="App.openFlowAiAssistant()" title="FlowHCM Voice & AI HRMS Assistant" style="display:none">
  <span class="flow-ai-pulse-dot"></span>
  <i class="fa fa-wand-magic-sparkles"></i>
  <span>FlowAI</span>
</button>

<!-- ══════════════════════════════════════
     SCRIPTS — Order matters!
══════════════════════════════════════ -->
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/employees.js"></script>
<script src="js/attendance.js"></script>
<script src="js/leaves.js"></script>
<script src="js/payroll.js"></script>
<script src="js/performance.js"></script>
<script src="js/events.js"></script>
<script src="js/administration.js"></script>
<script src="js/settings.js"></script>

  <!-- Inline: ensure all modules loaded (defined inside performance.js and events.js) -->
  <script>
    // Safety check — ensure all modules loaded
    window.addEventListener('DOMContentLoaded', () => {
      const required = ['API','DB','Auth','App','Dashboard','Employees','Attendance','Leaves','Payroll','Performance','Recruitment','Events','Reports','Administration','Settings','Toast','Modal','Utils'];
      const missing = required.filter(m => typeof window[m] === 'undefined');
      if (missing.length > 0) {
        console.error('HRM: Missing modules:', missing);
      } else {
        console.log('%c✅ HRM Pro loaded successfully — all modules ready', 'color:#10b981;font-weight:700;font-size:14px');
      }
    });
  </script>

<noscript>
  <div style="font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#0f1729;color:white;text-align:center;padding:20px">
    <div>
      <div style="font-size:48px;margin-bottom:16px">⚠️</div>
      <h2 style="font-size:24px;margin-bottom:8px">JavaScript Required</h2>
      <p style="color:#8899aa">HRM Pro requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
    </div>
  </div>
</noscript>

</body>
</html>
