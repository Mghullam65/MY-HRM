name: Build Mobile APK & Desktop App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ════════════════════════════════════════════════════════════
  # 1. BUILD ANDROID MOBILE APK (.apk)
  # ════════════════════════════════════════════════════════════
  build-android-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/*.apk release-artifacts/HRM-Pro-Mobile.apk
          ls -la release-artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRM-Pro-Mobile-APK
          path: release-artifacts/HRM-Pro-Mobile.apk
          retention-days: 30

  # ════════════════════════════════════════════════════════════
  # 2. BUILD WINDOWS DESKTOP APP (.zip / .exe)
  # ════════════════════════════════════════════════════════════
  build-windows-desktop:
    name: 💻 Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Packaging Tools
        working-directory: ./desktop
        run: |
          npm install --no-fund --no-audit

      - name: Package Windows Desktop App
        working-directory: ./desktop
        run: |
          npx electron-packager . "HRM-Pro" --platform=win32 --arch=x64 --out=dist --overwrite

      - name: Archive Desktop Binary to Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Compress-Archive -Path "desktop/dist/HRM-Pro-win32-x64/*" -DestinationPath "release-artifacts/HRM-Pro-Windows-Desktop.zip" -Force
          Get-Item release-artifacts/HRM-Pro-Windows-Desktop.zip

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRM-Pro-Windows-Desktop
          path: release-artifacts/HRM-Pro-Windows-Desktop.zip
          retention-days: 30

  # ════════════════════════════════════════════════════════════
  # 3. PUBLISH GITHUB RELEASE WITH DIRECT DOWNLOAD LINKS
  # ════════════════════════════════════════════════════════════
  publish-release:
    name: 🚀 Publish Direct Download Links
    needs: [build-android-apk, build-windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: HRM-Pro-Mobile-APK
          path: release-downloads

      - name: Download Windows Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: HRM-Pro-Windows-Desktop
          path: release-downloads

      - name: List Release Files
        run: ls -la release-downloads/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: "HRM Pro v3.1.0 — Official Mobile APK & Desktop Release"
          body: |
            ### 📥 HRM Pro Official Standalone Application Downloads
            
            Choose your platform below to download the application files:
            
            - 📱 **Android Mobile App (`.apk`)**: Direct installer file for all Android phones and tablets (Samsung, Xiaomi, Oppo, Vivo, Infinix, Pixel, etc.).
              - File: `HRM-Pro-Mobile.apk`
              - Features: Biometric GPS clock-in, Geofencing, Camera receipts upload, Push notifications, and offline punch caching.
            
            - 💻 **Windows Desktop Application (`.zip`)**: Standalone desktop app for Windows 10 & 11 PCs and Laptops.
              - File: `HRM-Pro-Windows-Desktop.zip`
              - Installation: Extract the ZIP and double-click `HRM-Pro.exe` to run.
          files: |
            release-downloads/HRM-Pro-Mobile.apk
            release-downloads/HRM-Pro-Windows-Desktop.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
